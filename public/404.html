<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1F5133" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Page not found | Dages Services, LLC</title>
    <style>
      :root {
        --brand: #1f5133;
        --tint: #e8f2ec;
        --ink: #1a1816;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--tint);
        color: var(--ink);
        font-family: 'Source Sans 3', 'Source Sans 3 Fallback', -apple-system,
          BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: var(--brand);
        font-family: Outfit, 'Outfit Fallback', -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        font-size: 2rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        border-radius: 6px;
        background: var(--brand);
        color: var(--tint);
        font-weight: 600;
        text-decoration: none;
        padding: 12px 20px;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That page isn’t on this site. Go back home to get a callback or call Joseph.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
