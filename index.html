    <title>Dages Services, LLC</title>
    <style>
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/outfit-700-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Outfit Fallback';
        src: local('Arial');
        size-adjust: 133.44%;
        ascent-override: 74.9%;
        descent-override: 19.5%;
        line-gap-override: 0%;
      }
      #hero-lcp {
        position: absolute;
        top: 4rem;
        left: 0;
        z-index: 0;
        width: 100%;
        height: 75rem;
        object-fit: cover;
        pointer-events: none;
      }
      #hero-lcp[hidden] {
        display: none;
      }
      #root {
        position: relative;
        z-index: 1;
      }
    </style>
    <!-- Swap Outfit / Source Sans 3 when brand fonts are chosen. -->
    <link rel="preconnect" href="https://xdqkpkicoorhweqgzubb.supabase.co" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/outfit-700-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <img
      id="hero-lcp"
      src="/hero-poster.webp"
      alt=""
      width="1024"
      height="576"
      fetchpriority="high"
      decoding="async"
    />
    <div id="root"></div>
    <script>
      (function () {
        function loadBodyFonts() {
          if (document.getElementById('source-sans-3')) return
          var link = document.createElement('link')
          link.id = 'source-sans-3'
          link.rel = 'stylesheet'
          link.href = '/fonts/source-sans-3.css'
          link.fetchPriority = 'low'
          document.head.appendChild(link)
        }
        var poster = document.getElementById('hero-lcp')
        if (poster && !poster.complete) {
          poster.addEventListener('load', loadBodyFonts, { once: true })
          poster.addEventListener('error', loadBodyFonts, { once: true })
        } else {
          loadBodyFonts()
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
