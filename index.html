    <script>
      (function () {
        function loadBodyFonts() {
          if (document.getElementById('source-sans-3')) return
          var link = document.createElement('link')
          link.id = 'source-sans-3'
          link.rel = 'stylesheet'
          link.href = '/fonts/source-sans-3.css'
          link.fetchPriority = 'low'
          document.head.appendChild(link)
        }
        function scheduleBodyFonts() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadBodyFonts)
          } else {
            setTimeout(loadBodyFonts, 0)
          }
        }
        var poster = document.getElementById('hero-lcp')
        if (poster && !poster.complete) {
          poster.addEventListener('load', scheduleBodyFonts, { once: true })
          poster.addEventListener('error', scheduleBodyFonts, { once: true })
        } else {
          scheduleBodyFonts()
        }
      })()
